[project]
name = "mapc-sa"
version = "0.1.0"
description = "Simulated Annealing for WiFi Network Configuration Optimization"

readme = "README.md"
license = {file = "LICENSE"}

authors = [
  {name = "Maksymilian Wojnar", email = "maksymilian.wojnar@agh.edu.pl"}
]

requires-python = ">=3.12"
dependencies = [
    "jax~=0.8.0",
    "numpy~=2.3.5",
    "optuna~=4.5.0",
    "joblib~=1.5.3",
    "mapc_optimal_research@git+https://github.com/ml4wifi-devs/mapc-optimal-research",
    "tqdm~=4.67.3",
]

[tool.setuptools.packages]
find = {}

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
